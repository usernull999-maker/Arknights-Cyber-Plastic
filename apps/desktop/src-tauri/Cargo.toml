[package]
name = "arknights-super-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
arknights-super-contract = { path = "../../../crates/app-contract" }
arknights-super-core = { path = "../../../crates/app-core" }
arknights-super-ruler-bridge = { path = "../../../crates/ruler-bridge" }
base64 = "0.22"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
crossbeam-channel = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
tauri = { version = "2.11.5", features = [] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
